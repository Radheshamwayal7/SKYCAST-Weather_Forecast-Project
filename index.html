<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SkyCast | Weather Forecast</title>
    <link rel="icon" type="image/png" href="images/FAVICON-SKYCAST.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS File -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Ambient radar backdrop -->
    <div class="radar-field" aria-hidden="true"></div>

    <!-- Toast / popper notifications -->
    <div class="toast-stack" id="toast-stack" aria-live="polite"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Weather Card -->
        <div class="weather-card" id="weather-card">

            <header class="console-header">
                <p class="eyebrow">Live Atmospheric Readout</p>
                <h1>SkyCast Weather Forecast</h1>
            </header>

            <!-- Search Section -->
            <div class="search-box">

                <div class="input-wrap">
                    <input
                        type="text"
                        id="city"
                        placeholder="Search a city&hellip;"
                        autocomplete="off">

                    <ul id="suggestions" class="suggestions" hidden></ul>
                </div>

                <button id="search-btn">
                    Search
                </button>

                <button id="location-btn">
                    <span class="pin">📍</span> My Location
                </button>

            </div>

            <!-- Weather Information -->
            <div class="weather-info">

                <div class="hero">

                    <div class="icon-stage">
                        <div class="hero-radar" aria-hidden="true">
                            <span class="ring ring-1"></span>
                            <span class="ring ring-2"></span>
                            <span class="ring ring-3"></span>
                            <span class="sweep"></span>
                        </div>

                        <img
                            id="weather-icon"
                            alt="Weather Icon">
                    </div>

                    <div class="hero-readout">
                        <h2 id="city-name">Pune</h2>
                        <p id="date-time"></p>
                        <h1 id="temperature">25°C</h1>
                        <p id="condition">Clear Sky</p>
                    </div>

                </div>

                <div class="details">

                    <div class="detail-box">
                        <h3>Humidity</h3>
                        <p id="humidity">60%</p>
                    </div>

                    <div class="detail-box">
                        <h3>Wind</h3>
                        <p id="wind">10 km/h</p>
                    </div>

                    <div class="detail-box">
                        <h3>Pressure</h3>
                        <p id="pressure">1012 hPa</p>
                    </div>

                    <div class="detail-box">
                        <h3>Feels Like</h3>
                        <p id="feels-like">27°C</p>
                    </div>
                    <div class="detail-box">
                        <h3>Sunrise</h3>
                        <p id="sunrise">--</p>
                    </div>

                    <div class="detail-box">
                        <h3>Sunset</h3>
                        <p id="sunset">--</p>
                    </div>

                    <div class="detail-box">
                        <h3>Min Temp</h3>
                        <p id="min-temp">--°C</p>
                    </div>

                    <div class="detail-box">
                        <h3>Max Temp</h3>
                        <p id="max-temp">--°C</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- JavaScript File -->
    <script src="script.js"></script>

</body>

</html>
